       Mapbox
  ========================================== -->

      box-sizing: border-box;

  --pin-color: #d94f7a;

    html,

      margin: 0;
      padding: 0;

      width: 100%;
      height: 100%;

      overflow: hidden;

      font-family:

    /* =========================================

    ========================================== */

    /* =========================================
       左側スケジュール
    ========================================== */

      border-right: 1px solid #e5e5e5;

      overflow-y: auto;

      flex-shrink: 0;

      z-index: 20;

      padding: 20px 20px 14px;

      border-bottom: 1px solid #eeeeee;

      font-size: 13px;

      font-weight: 600;

      letter-spacing: 0.04em;

    }


    #schedule-content {

      padding: 8px 0 30px;

    }


    /* =========================================
       都市
    ========================================== */

    .city-section {

      border-bottom: 1px solid #eeeeee;

    }


    .city-section.hidden {

      display: none;

    }


    .city-header {

      width: 100%;

      padding: 14px 20px;

      border: none;

      background: #ffffff;

      text-align: left;

      cursor: pointer;

      display: flex;

      justify-content: space-between;

      align-items: center;

      font-size: 13px;

      font-weight: 600;

      color: #222222;

    }


    .city-header:hover {

      background: #f7f7f7;

    }


    .city-arrow {

      font-size: 11px;

      color: #888888;

      transition: transform 0.2s ease;

    }


    .city-section.collapsed .city-arrow {

      transform: rotate(-90deg);

    }


    .city-places {

      padding: 0 10px 12px;

    }


    .city-section.collapsed .city-places {

      display: none;

    }


    /* =========================================
       日付
    ========================================== */

    .date-section {

      margin-bottom: 2px;

    }


    .date-header {
  width: 100%;

  padding: 9px 10px 7px 20px;

  border: none;

  background: transparent;

  text-align: left;

  cursor: pointer;

  display: flex;

  justify-content: space-between;

  align-items: center;

  color: #777777;

  font-size: 11px;

  font-weight: 600;

  letter-spacing: 0.04em;
}


    .date-header:hover {

      background: #f7f7f7;

    }


    .date-arrow {

      color: #aaa;

    }


    .date-section.collapsed .date-arrow {

      transform: rotate(-90deg);

    }

      padding-bottom: 5px;

    }


    .date-section.collapsed .date-places {

    }

       スケジュールの場所
    ========================================== */

    .schedule-item {

      width: 100%;

      border: none;

      background: transparent;

      text-align: left;

      cursor: pointer;

      padding: 8px 10px 8px 28px;

      display: block;

    .schedule-item:hover {

       地図エリア
    ========================================== */

      height: 100%;

      height: 100%;

    ========================================== */

    ========================================== */

/* クリックして選択中 */

}

      }

    }

  </style>

    // =========================================
    // CSV parser
    // =========================================

    function parseCSV(text) {

      const rows = [];

      let row = [];

      let cell = '';

      let insideQuotes = false;


      for (
        let i = 0;
        i < text.length;
        i++
      ) {

        const char = text[i];

        const next = text[i + 1];


        if (
          char === '"' &&
          insideQuotes &&
          next === '"'
        ) {

          cell += '"';

          i++;

        }


        else if (char === '"') {

          insideQuotes =
            !insideQuotes;

        }


        else if (
          char === ',' &&
          !insideQuotes
        ) {

          row.push(cell);

          cell = '';

        }


        else if (
          (char === '\n' ||
           char === '\r') &&
          !insideQuotes
        ) {

          if (
            char === '\r' &&
            next === '\n'
          ) {

            i++;

          }


          row.push(cell);

          cell = '';


          if (
            row.some(
              value =>
                value.trim() !== ''
            )
          ) {

            rows.push(row);

          }


          row = [];

        }


        else {

          cell += char;

        }

      }


      if (
        cell !== '' ||
        row.length > 0
      ) {

        row.push(cell);

        rows.push(row);

      }


      return rows;

    }


    // =========================================
    // HTML escape
    // =========================================

    function escapeHTML(text) {

      if (!text) {

        return '';

      }


      return String(text)

        .replace(
          /&/g,
          '&amp;'
        )

        .replace(
          /</g,
          '&lt;'
        )

        .replace(
          />/g,
          '&gt;'
        )

        .replace(
          /"/g,
          '&quot;'
        )

        .replace(
          /'/g,
          '&#039;'
        );

    }

    // =========================================
// 本文の余白を整理
// =========================================

function cleanText(text) {

  if (!text) {
    return '';
  }

  return String(text)
    .replace(/\r\n/g, '\n')
    .replace(/\r/g, '\n')
    .replace(/^[ \t　]+/gm, '')
    .replace(/[ \t　]+$/gm, '')
    .replace(/\n{3,}/g, '\n\n')
    .trim();

}


    // =========================================
    // 日付
    // =========================================

    function formatDate(dateText) {

      if (!dateText) {

        return '';

      }


      const parts =
        dateText.split('-');


      if (parts.length === 3) {

        return (
          parts[0] +
          '.' +
          parts[1] +
          '.' +
          parts[2]
        );

      }


      return dateText;

    }
    // =========================================
// 日付＋時刻
// 2026-08-04 + 09:00
// → 08.04.09:00
// =========================================

function formatDateTime(place) {

  const dateParts =
    (place.date || '').split('-');

  let dateText = '';

  if (dateParts.length === 3) {

    dateText =
      dateParts[1] +
      '.' +
      dateParts[2];

  }

  const timeText =
    (place.time || '').trim();

  if (dateText && timeText) {
    return `${dateText}.${timeText}`;
  }

  if (dateText) {
    return dateText;
  }

  if (timeText) {
    return timeText;
  }

  return '';

}

    // =========================================
// 都市 → 国旗
// =========================================

function getCountryFlag(city) {

  if (!city) {
    return '';
  }

  const name = city.trim();

  const flags = {

    'バルセロナ': '🇪🇸',

    'ローマ': '🇮🇹',
    'ピサ': '🇮🇹',
    'フィレンツェ': '🇮🇹',
    'ヴェネツィア': '🇮🇹',
    'ベネチア': '🇮🇹',

    'パリ': '🇫🇷',
    'モン・サン・ミシェル': '🇫🇷',

    'ロンドン': '🇬🇧',
    'ブライトン': '🇬🇧',
    'オックスフォード': '🇬🇧',

    'プラハ': '🇨🇿',

    '台北': '🇹🇼',

    '上海': '🇨🇳',

    '東京': '🇯🇵',
    '成田': '🇯🇵'

  };

  return flags[name] || '';

}


    // =========================================
    // 日付短縮表示
    // 2026-08-05 → 08.05
    // =========================================

    function formatShortDate(dateText) {

      if (!dateText) {

        return '';

      }


      const parts =
        dateText.split('-');


      if (parts.length === 3) {

        return (
          parts[1] +
          '.' +
          parts[2]
        );

      }


      return dateText;

    }

   

    // =========================================
    // 時刻
    // =========================================

    function formatTime(timeText) {

      if (!timeText) {

        return '';

      }


      return timeText.trim();

    }


    // =========================================
    // 画像URLを配列化
    //
    // Google Sheetsの image セルは
    // | で複数画像を区切る
    // =========================================

    function getImageUrls(place) {

      return (place.image || '')

        .split('|')

        .map(
          image =>
            image.trim()
        )

        .filter(
          image =>
            image !== ''
        );

    }


    // =========================================
    // ③ Popup画像カルーセル
    // =========================================

    function setupImageCarousel(popup) {

      const popupElement =
        popup.getElement();


      if (!popupElement) {

        return;

      }


      const slider =
        popupElement.querySelector(
          '.popup-image-slider'
        );


      if (!slider) {

        return;

      }


      const slides =
        popupElement.querySelectorAll(
          '.popup-image-slide'
        );


      const dots =
        popupElement.querySelectorAll(
          '.image-dot'
        );


      const leftButton =
        popupElement.querySelector(
          '.image-arrow-left'
        );


      const rightButton =
        popupElement.querySelector(
          '.image-arrow-right'
        );


      let currentIndex = 0;


      function update() {

        if (!slides.length) {

          return;

        }


        slides.forEach(
          (slide, index) => {

            slide.style.display =
              index === currentIndex
                ? 'block'
                : 'none';

          }
        );


        dots.forEach(
          (dot, index) => {

            dot.classList.toggle(
              'active',
              index === currentIndex
            );

          }
        );

      }


      function goTo(index) {

        const length =
          slides.length;


        if (!length) {

          return;

        }


        currentIndex =
          (index + length) %
          length;


        update();

      }


      if (leftButton) {

        leftButton.addEventListener(
          'click',
          event => {

            event.stopPropagation();

            goTo(
              currentIndex - 1
            );

          }
        );

      }


      if (rightButton) {

        rightButton.addEventListener(
          'click',
          event => {

            event.stopPropagation();

            goTo(
              currentIndex + 1
            );

          }
        );

      }


      dots.forEach(
        (dot, index) => {

          dot.addEventListener(
            'click',
            event => {

              event.stopPropagation();

              goTo(index);

            }
          );

        }
      );


      update();

    }

    // =========================================
    // 詳細パネル画像カルーセル
    // =========================================

    function setupDetailCarousel() {

      const image =
        document.getElementById(
          'detail-image'
        );


      if (!image) {

        return;

      }


      const prev =
        document.getElementById(
          'detail-image-prev'
        );


      const next =
        document.getElementById(
          'detail-image-next'
        );


      const dots =
        document.querySelectorAll(
          '.detail-image-dot'
        );


      function update() {

        if (!currentDetailImages.length) {

          return;

        }


        image.src =
          currentDetailImages[
            currentDetailImageIndex
          ];


        dots.forEach(
          (dot, index) => {

            dot.classList.toggle(
              'active',
              index ===
                currentDetailImageIndex
            );

          }
        );

      }


      function goTo(index) {

        const length =
          currentDetailImages.length;


        if (!length) {

          return;

        }


        currentDetailImageIndex =
          (index + length) %
          length;


        update();

      }


      if (prev) {

        prev.addEventListener(
          'click',
          () => {

            goTo(
              currentDetailImageIndex - 1
            );

          }
        );

      }


      if (next) {

        next.addEventListener(
          'click',
          () => {

            goTo(
              currentDetailImageIndex + 1
            );

          }
        );

      }


      dots.forEach(
        dot => {

          dot.addEventListener(
            'click',
            () => {

              goTo(
                Number(
                  dot.dataset.index
                )
              );

            }
          );

        }
      );


      update();

    // =========================================
    // ⑥ スケジュールを作る
    // =========================================

    function createSchedule() {

      const scheduleContent =
        document.getElementById(
          'schedule-content'
        );


      scheduleContent.innerHTML = '';


      scheduleItems = [];


      // ---------------------------------------
      // order順
      // ---------------------------------------

      const sortedPlaces =
        [...places].sort(
          (a, b) =>
            Number(a.order || 999999) -
            Number(b.order || 999999)
        );


      // ---------------------------------------
      // 都市ごと
      // ---------------------------------------

      const cityGroups =
        new Map();


      sortedPlaces.forEach(
        place => {

          const city =
            place.city || 'その他';


          if (!cityGroups.has(city)) {

            cityGroups.set(
              city,
              []
            );

          }


          cityGroups
            .get(city)
            .push(place);

        }
      );


      let cityIndex = 0;


      cityGroups.forEach(
        (cityPlaces, city) => {


          const section =
            document.createElement(
              'section'
            );


          section.className =
            'city-section';


          // 最初の都市だけ開く

          if (cityIndex !== 0) {

            section.classList.add(
              'collapsed'
            );

          }


          cityIndex++;


          // -------------------------------------
          // 都市ヘッダー
          // -------------------------------------

          const cityHeader =
            document.createElement(
              'button'
            );


          cityHeader.className =
            'city-header';

            const countryFlag =
            getCountryFlag(city);

          cityHeader.innerHTML = `
          <span>
             ${countryFlag}${escapeHTML(city)}
             </span>
             <span class="city-arrow">
              ▼
              </span>
              `;


          cityHeader.addEventListener(
            'click',
            () => {

              section.classList.toggle(
                'collapsed'
              );

            }
          );


          section.appendChild(
            cityHeader
          );


          // -------------------------------------
          // 都市内
          // -------------------------------------

          const cityContainer =
            document.createElement(
              'div'
            );


          cityContainer.className =
            'city-places';


          // -------------------------------------
          // 日付ごと
          // -------------------------------------

          const dateGroups =
            new Map();


          cityPlaces.forEach(
            place => {

              const date =
                place.date || '';


              if (!dateGroups.has(date)) {

                dateGroups.set(
                  date,
                  []
                );

              }


              dateGroups
                .get(date)
                .push(place);

            }
          );


          let dateIndex = 0;


          dateGroups.forEach(
            (datePlaces, date) => {


              const dateSection =
                document.createElement(
                  'div'
                );


              dateSection.className =
                'date-section';


              // 最初の日付だけ開く

              if (dateIndex !== 0) {

                dateSection.classList.add(
                  'collapsed'
                );

              }


              dateIndex++;


              // ---------------------------------
              // 日付ヘッダー
              // ---------------------------------

              const dateHeader =
                document.createElement(
                  'button'
                );


              dateHeader.className =
                'date-header';


              dateHeader.innerHTML = `

                <span>
                  ${escapeHTML(
                    formatShortDate(date)
                  )}
                </span>

                <span class="date-arrow">
                  ▼
                </span>

              `;


              dateHeader.addEventListener(
                'click',
                () => {

                  dateSection.classList.toggle(
                    'collapsed'
                  );

                }
              );


              dateSection.appendChild(
                dateHeader
              );


              // ---------------------------------
              // 場所一覧
              // ---------------------------------

              const dateContainer =
                document.createElement(
                  'div'
                );


              dateContainer.className =
                'date-places';


              datePlaces.forEach(
                place => {


                  const item =
                    document.createElement(
                      'button'
                    );


                  item.className =
                    'schedule-item';


                  item.dataset.category =
                    place.category || '';


                  item.dataset.id =
                    place.id || '';


                  item.innerHTML = `

                    ${
                      place.time
                        ? `

                          <div
                            class="schedule-item-time"
                          >
                            ${escapeHTML(
                              formatTime(
                                place.time
                              )
                            )}
                          </div>

                        `
                        : ''
                    }


                    <div
                      class="schedule-item-name"
                    >
                      ${escapeHTML(
                        place.name
                      )}
                    </div>

                  `;


                  item.addEventListener(
                    'click',
                    () => {

                      focusPlace(place);

                    }
                  );


                  dateContainer.appendChild(
                    item
                  );


                  scheduleItems.push({

                    element:
                      item,

                    place:
                      place,

                    dateSection:
                      dateSection,

                    citySection:
                      section

                  });

                }
              );


              dateSection.appendChild(
                dateContainer
              );


              cityContainer.appendChild(
                dateSection
              );

            }
          );


          section.appendChild(
            cityContainer
          );


          scheduleContent.appendChild(
            section
          );

        }
      );


      // 現在のカテゴリーを反映

      applyScheduleFilter();

    }


    // =========================================
    // ⑦ 場所へ移動
    // =========================================

    function focusPlace(place) {


      const lng =
        Number(place.lng);


      const lat =
        Number(place.lat);


      if (
        Number.isNaN(lng) ||
        Number.isNaN(lat)
      ) {

        return;

      }


      const markerData =
        markers.find(
          marker =>
            marker.place.id ===
            place.id
        );


      if (!markerData) {

        return;

      }


      // ---------------------------------------
      // カテゴリーフィルター中の場合
      // ---------------------------------------

      if (
        activeCategory !== 'all' &&
        place.category !== activeCategory
      ) {

        setCategoryFilter(
          'all'
        );

      }


      // ---------------------------------------
      // 詳細パネルを閉じる
      // ---------------------------------------

      closeDetail();


      // ---------------------------------------
      // ポップアップ
      // ---------------------------------------

      markerData.marker
        .getPopup()
        .addTo(map);


      // ---------------------------------------
      // 地図移動
      //
      // 左にスケジュールがあるため
      // 少し右側に場所を置く
      // ---------------------------------------

      map.flyTo({

        center: [
          lng,
          lat
        ],

        zoom: 15.5,

        duration: 1500,

        essential: true,

        offset: [
          120,
          0
        ]

      });

    }


    // =========================================
    // ⑧ カテゴリーボタン
    // =========================================

    function createCategoryButtons() {


      const categoryBar =
        document.getElementById(
          'category-bar'
        );


      // すでにALL以外を削除

      categoryBar
        .querySelectorAll(
          '.category-button:not([data-category="all"])'
        )
        .forEach(
          button =>
            button.remove()
        );


      const categories =
        [
          ...new Set(

            places

              .map(
                place =>
                  place.category
              )

              .filter(
                category =>
                  category
              )

          )
        ];


      categories.forEach(

            document.createElement(
              'button'
            );


          button.className =
            'category-button';


          button.dataset.category =
            category;


          button.textContent =
            '#' + category;


          button.addEventListener(
            'click',
            () => {

              setCategoryFilter(
                category
              );

            }
          );


          categoryBar.appendChild(
            button
          );

        }
      );


      const allButton =
        categoryBar.querySelector(
          '[data-category="all"]'
        );


      allButton.addEventListener(
        'click',
        () => {

          setCategoryFilter(
            'all'
          );

        }
      );

    }


    // =========================================
    // ⑨ カテゴリーフィルター
    // =========================================

    function setCategoryFilter(
      selectedCategory
    ) {


      activeCategory =
        selectedCategory;


      // ---------------------------------------
      // ボタン
      // ---------------------------------------

      document
        .querySelectorAll(
          '.category-button'
        )
        .forEach(
          button => {

            button.classList.toggle(

              'active',

              button.dataset.category ===
              selectedCategory

            );

          }
        );


      // ---------------------------------------
      // ピン
      // ---------------------------------------

      markers.forEach(
        markerData => {


          const marker =
            markerData.marker;


          const element =
            marker.getElement();


          const category =
            markerData.place.category;


          const visible =
            selectedCategory === 'all' ||
            category === selectedCategory;


          if (visible) {

            element.style.display =
              '';

          }

          else {

            element.style.display =
              'none';

          }

        }
      );


      // ---------------------------------------
      // スケジュール
      // ---------------------------------------

      applyScheduleFilter();


      // ---------------------------------------
      // 選択中のPopup
      // ---------------------------------------

      if (
        selectedCategory !== 'all'
      ) {

        markers.forEach(
          markerData => {

            if (
              markerData.place.category !==
              selectedCategory
            ) {

              markerData.marker
                .getPopup()
                .remove();

            }

          }
        );

      }

    }


    // =========================================
    // スケジュールフィルター
    // =========================================

    function applyScheduleFilter() {


      scheduleItems.forEach(
        itemData => {


          const category =
            itemData.place.category;


          const visible =
            activeCategory === 'all' ||
            category === activeCategory;


          itemData.element.classList.toggle(
            'hidden',
            !visible
          );

        }
      );


      // ---------------------------------------
      // 日付を表示するか
      // ---------------------------------------

      document
        .querySelectorAll(
          '.date-section'
        )
        .forEach(
          dateSection => {


            const visibleItems =
              dateSection.querySelectorAll(
                '.schedule-item:not(.hidden)'
              );


            dateSection.style.display =
              visibleItems.length > 0
                ? ''
                : 'none';

          }
        );


      // ---------------------------------------
      // 都市を表示するか
      // ---------------------------------------

      document
        .querySelectorAll(
          '.city-section'
        )
        .forEach(
          citySection => {


            const visibleItems =
              citySection.querySelectorAll(
                '.schedule-item:not(.hidden)'
              );


            citySection.classList.toggle(

              'hidden',

              visibleItems.length === 0

            );

          }
        );

    }


    // =========================================
    // ⑩ Google Sheetsから読み込む
    // =========================================

    const cacheBuster =
      '&_=' + Date.now();


    fetch(
      sheetUrl +
      cacheBuster
    )


      .then(
        response => {


          console.log(
            'CSV取得ステータス:',
            response.status
          );


          console.log(
            'CSV取得OK:',
            response.ok
          );


          if (!response.ok) {

            throw new Error(
              'Google SheetsのCSVを取得できませんでした。'
            );

          }


          return response.text();

        }
      )


      .then(
        csv => {


          console.log(
            'Google Sheets CSV取得成功'
          );


          // -----------------------------------
          // CSV解析
          // -----------------------------------

          const rows =
            parseCSV(csv);


          console.log(
            '読み込んだ行数:',
            rows.length
          );


          if (
            rows.length === 0
          ) {

            throw new Error(
              'CSVにデータがありません。'
            );

          }


          // -----------------------------------
          // 見出し
          // -----------------------------------

          const headers =
            rows[0].map(
              header =>
                header
                  .replace(
                    /^\uFEFF/,
                    ''
                  )
                  .trim()
            );


          console.log(
            '見出し:',
            headers
          );


          // -----------------------------------
          // PLACEデータ
          // -----------------------------------

          rows
            .slice(1)
            .forEach(
              values => {


                const place = {};


                headers.forEach(
  (header, i) => {

    place[header] =
      values[i]
        ? cleanText(values[i])
        : '';

  }
);


                // ---------------------------------
                // 緯度経度
                // ---------------------------------

                if (
                  !place.lat ||
                  !place.lng
                ) {

                  console.log(
                    '緯度・経度がないためスキップ:',
                    place.name
                  );

                  return;

                }


                const lat =
                  Number(place.lat);


                const lng =
                  Number(place.lng);


                if (
                  Number.isNaN(lat) ||
                  Number.isNaN(lng)
                ) {

                  console.log(
                    '緯度・経度が不正:',
                    place.name
                  );

                  return;

                }


                // ---------------------------------
                // データ保存
                // ---------------------------------

                places.push(
                  place
                );


                // ---------------------------------
                // Popup
                // ---------------------------------

                const popup =
                  new mapboxgl.Popup({

                    offset: 15,

                    closeButton: true,

                    closeOnClick: true

                  });


                popup.setHTML(
                  createPopup(place)
                );


                // ---------------------------------
                // Popupが開いたとき
                // ---------------------------------

                popup.on(
                  'open',
                  () => {

                    setupImageCarousel(
                      popup
                    );

                    setupPopupDetailButton(
                      popup,
                      place
                    );

                  }
                );


                // ---------------------------------
                // カスタムピン
                // ---------------------------------

                const markerElement =
                  document.createElement(
                    'div'
                  );


                markerElement.className =
                  'place-marker';


                // ---------------------------------
                // Marker
                // ---------------------------------

                const marker =
                  new mapboxgl.Marker({

                    element:
                      markerElement

                  })

                    .setLngLat([

                      lng,

                      lat

                    ])

                    .setPopup(
                      popup
                    )

                    .addTo(map);
                    popup.on(
  'open',
  () => {

    markerElement.classList.add(
      'selected'
    );

  }
);


popup.on(
  'close',
  () => {

    markerElement.classList.remove(
      'selected'
    );

  }
);


                // ---------------------------------
                // Marker保存
                // ---------------------------------

                markers.push({

                  marker:
                    marker,

                  place:
                    place

                });


                console.log(
                  '★ ピン追加:',
                  place.name
                );

              }
            );


          // =====================================
          // データ読み込み完了
          // =====================================

          console.log(
            '========== PLACES読み込み完了 =========='
          );


          // =====================================
          // スケジュール
          // =====================================

          createSchedule();


          // =====================================
          // カテゴリーボタン
          // =====================================

          createCategoryButtons();


        }
      )


      .catch(
        error => {

          console.error(

            '★ Google Sheetsの読み込みに失敗しました。',

            error

          );

        }
      );


  </script>


</body>

</html>
